<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker - Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Left Side -->
        <div class="login-info">
            <div class="brand-icon">💰</div>

            <h1>Smart Expense<br>Tracker</h1>

            <p>
                Manage your money smarter.<br>
                Track your income and expenses<br>
                with ease.
            </p>

            <div class="feature-list">
                <div>✓ Easy Expense Management</div>
                <div>✓ Secure Firebase Login</div>
                <div>✓ Smart Spending Analysis</div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="login-card">

            <div class="welcome-icon">👋</div>

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Login to continue to your dashboard
            </p>

            <div class="form-group">
                <label for="loginEmail">Email Address</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                >
            </div>

            <button id="loginBtn" class="login-button">
                Login
            </button>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
